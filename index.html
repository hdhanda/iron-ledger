<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#101217">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Ledger">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Iron Ledger</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap');

:root{--bg:#101217;--surf:#181B22;--raise:#22262F;--line:#2E333E;--ink:#E9E7E2;
  --mute:#828A99;--sig:#FF6A1A;--ok:#4CAF7D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
input,select,textarea{font-family:inherit}
.disp{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}

#shell{max-width:560px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 0 12px;margin-bottom:16px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.title{font-size:22px;font-weight:700;line-height:1}
.sub{font-size:10px;color:var(--mute);letter-spacing:.14em;margin-top:5px;text-transform:uppercase}

.card{background:var(--surf);border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.pad{padding:14px}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap;gap:8px}
.mute{color:var(--mute)}
.lbl{font-size:10px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase;font-weight:600}

.btn{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:13px 16px;
  font-size:14px;font-weight:600;width:100%;display:block;transition:transform .1s}
.btn:active{transform:scale(.985)}
.btn-sig{background:var(--sig);color:#101217;border-color:var(--sig)}
.btn-ok{background:var(--ok);color:#101217;border-color:var(--ok)}
.btn-sm{padding:9px 13px;font-size:12px;width:auto}
.btn[disabled]{opacity:.45}

.chip{background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:9px 15px;
  font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--sig);color:#101217;border-color:var(--sig);font-weight:600}
.chip.sm{padding:7px 12px;font-size:11px}

.step{display:flex;align-items:center;gap:6px}
.step button{width:46px;height:52px;background:var(--raise);border:1px solid var(--line);
  border-radius:8px;font-size:22px;font-weight:600;flex-shrink:0}
.step input{flex:1;min-width:0;width:100%;height:52px;background:#0C0E12;border:1px solid var(--line);
  border-radius:8px;color:var(--ink);font-size:24px;font-weight:600;text-align:center;
  font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.ghost{display:flex;align-items:baseline;gap:8px;font-size:12px;padding:8px 10px;background:#0C0E12;
  border-left:2px solid var(--line);border-radius:0 6px 6px 0;flex-wrap:wrap}
.ghost .v{font-family:'JetBrains Mono',monospace;color:var(--mute)}
.ghost.beat{border-left-color:var(--sig)}
.ghost.beat .v{color:var(--sig)}
.plan{border-left-color:#4A5160;margin-top:6px}

.setrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.setrow:last-child{border-bottom:none}
.setno{width:20px;font-size:11px;color:var(--mute);font-weight:600}
.pr{color:var(--sig);font-size:10px;font-weight:700;letter-spacing:.1em}
.warm{color:var(--mute);font-size:10px;letter-spacing:.1em}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--line);
  display:flex;z-index:30}
nav button{flex:1;padding:13px 4px calc(13px + env(safe-area-inset-bottom));font-size:10px;
  letter-spacing:.12em;color:var(--mute);font-weight:600;text-transform:uppercase}
nav button.on{color:var(--sig);box-shadow:inset 0 2px 0 var(--sig)}

.sheet{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
.sheet.open{display:flex}
.field{width:100%;height:48px;background:var(--surf);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);padding:0 14px;font-size:16px}
textarea.field{height:auto;min-height:72px;padding:12px 14px;resize:vertical;line-height:1.5}
.pick{width:100%;text-align:left;padding:14px;border-bottom:1px solid var(--line);display:block}
.empty{text-align:center;padding:44px 20px;color:var(--mute);font-size:14px;line-height:1.65}

.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));
  background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:13px 15px;
  font-size:13px;z-index:60;max-width:528px;margin:0 auto;opacity:0;pointer-events:none;
  transition:opacity .18s;text-align:center}
.toast.show{opacity:1}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sig);margin-left:6px;vertical-align:middle}
.spark{width:100%;height:44px;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="shell">
  <header>
    <div>
      <div class="disp title">Iron Ledger</div>
      <div class="sub" id="hsub">—</div>
    </div>
    <div id="hact"></div>
  </header>
  <main id="view"></main>
</div>

<nav id="nav"></nav>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════ CONSTANTS ═══════════════════════════ */
const SCHEMA = 2, LS = 'ironledger';

const PATTERN_GROUP = {
  'Horizontal Push':'Push','Vertical Push':'Push','Chest Iso':'Push','Side Delt':'Push','Triceps':'Push',
  'Vertical Pull':'Pull','Horizontal Pull':'Pull','Rear Delt':'Pull','Biceps':'Pull',
  'Squat':'Legs','Hinge':'Legs','Lunge':'Legs','Quad Iso':'Legs','Ham Iso':'Legs','Calves':'Legs',
  'Core':'Core','Other':'Other'
};
const SPLIT_PATTERNS = {
  Push:['Horizontal Push','Vertical Push','Chest Iso','Side Delt','Triceps'],
  Pull:['Vertical Pull','Horizontal Pull','Rear Delt','Biceps'],
  Legs:['Squat','Hinge','Lunge','Quad Iso','Ham Iso','Calves','Core'],
  Other:null
};
const SEED = [
 ['Barbell Bench Press','Horizontal Push',1],['Incline Barbell Press','Horizontal Push',1],
 ['Incline Dumbbell Press','Horizontal Push',1],['Flat Dumbbell Press','Horizontal Push',0],
 ['Machine Chest Press','Horizontal Push',0],['Incline Machine Press','Horizontal Push',0],
 ['Dips','Horizontal Push',0],['Overhead Press','Vertical Push',1],
 ['Dumbbell Shoulder Press','Vertical Push',0],['Machine Shoulder Press','Vertical Push',0],
 ['Cable Fly','Chest Iso',0],['Pec Deck','Chest Iso',0],['Lateral Raise','Side Delt',0],
 ['Cable Lateral Raise','Side Delt',0],['Tricep Pushdown','Triceps',0],
 ['Overhead Tricep Extension','Triceps',0],['Skullcrusher','Triceps',0],
 ['Pull-Up','Vertical Pull',1],['Chin-Up','Vertical Pull',0],['Lat Pulldown','Vertical Pull',1],
 ['Barbell Row','Horizontal Pull',1],['Dumbbell Row','Horizontal Pull',0],
 ['Seated Cable Row','Horizontal Pull',0],['Chest-Supported Row','Horizontal Pull',0],
 ['Shrug','Horizontal Pull',0],['Face Pull','Rear Delt',0],['Rear Delt Fly','Rear Delt',0],
 ['Barbell Curl','Biceps',0],['Dumbbell Curl','Biceps',0],['Hammer Curl','Biceps',0],
 ['Preacher Curl','Biceps',0],['Cable Curl','Biceps',0],
 ['Back Squat','Squat',1],['Front Squat','Squat',0],['Leg Press','Squat',1],['Hack Squat','Squat',0],
 ['Bulgarian Split Squat','Lunge',0],['Walking Lunge','Lunge',0],
 ['Romanian Deadlift','Hinge',1],['Deadlift','Hinge',1],['Hip Thrust','Hinge',0],
 ['Leg Curl','Ham Iso',0],['Leg Extension','Quad Iso',0],
 ['Standing Calf Raise','Calves',0],['Seated Calf Raise','Calves',0],
 ['Hanging Leg Raise','Core',0],['Cable Crunch','Core',0]
].map(([name,pattern,anchor])=>({id:slug(name),name,pattern,group:PATTERN_GROUP[pattern],anchor:!!anchor}));

const SEED_ROUTINES = [
 {id:'ppl-a',name:'PPL A',split:'Push',blocks:[
   ['Incline Dumbbell Press',4,6,10,5],['Machine Chest Press',3,8,12,10],
   ['Dumbbell Shoulder Press',3,8,12,5],['Cable Lateral Raise',3,12,20,5],['Tricep Pushdown',3,10,15,5]]},
 {id:'ppl-a',name:'PPL A',split:'Pull',blocks:[
   ['Lat Pulldown',4,8,12,10],['Barbell Row',4,6,10,5],['Seated Cable Row',3,10,14,10],
   ['Face Pull',3,12,20,5],['Hammer Curl',3,10,14,5]]},
 {id:'ppl-a',name:'PPL A',split:'Legs',blocks:[
   ['Leg Press',4,8,12,20],['Romanian Deadlift',3,8,12,10],['Bulgarian Split Squat',3,8,12,5],
   ['Leg Curl',3,10,15,10],['Standing Calf Raise',4,10,15,10]]}
].map(r=>({...r,blocks:r.blocks.map(([ex,sets,lo,hi,inc],i)=>(
  {order:i+1,exId:slug(ex),sets,repLow:lo,repHigh:hi,progression:'double',increment:inc}))}));

/* ═══════════════════════════ HELPERS ═══════════════════════════ */
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function uid(p){return p+'_'+Math.random().toString(36).slice(2,8)}
function e1rm(w,r){return r>0?+(w*(1+r/30)).toFixed(1):0}
function today(){const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2400)}
function $(id){return document.getElementById(id)}

/* ═══════════════════════════ STATE ═══════════════════════════ */
let DB, tab='train', NEWEX=null;

function blank(){return{schemaVersion:SCHEMA,exercises:SEED.slice(),routines:SEED_ROUTINES.slice(),
  sessions:[],cardio:[],body:[],active:null,settings:{endpoint:'',token:'',unit:'lb'}}}

function migrate(d){
  if(!d.schemaVersion||d.schemaVersion<2){
    d.routines=d.routines||SEED_ROUTINES.slice();
    (d.sessions||[]).forEach(s=>{
      s.status=s.status||'completed'; s.readiness=s.readiness||{sleep:0,soreness:0,stress:0};
      s.routineId=s.routineId||null; s.synced=!!s.synced;
      (s.entries||[]).forEach(e=>{e.plan=e.plan||null;
        (e.sets||[]).forEach(st=>{st.id=st.id||uid('s');st.warmup=!!st.warmup;st.t=st.t||null})});
    });
    d.schemaVersion=SCHEMA;
  }
  return d;
}
function load(){
  try{const raw=localStorage.getItem(LS); DB=raw?migrate(JSON.parse(raw)):blank()}
  catch(e){DB=blank()}
  DB.settings=Object.assign({endpoint:'',token:'',unit:'lb'},DB.settings||{});
}
function save(){try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){toast('Storage full — export and clear')}}

const exById=()=>Object.fromEntries(DB.exercises.map(e=>[e.id,e]));

function lastFor(exId,skipId){
  const done=DB.sessions.filter(s=>s.id!==skipId).sort((a,b)=>b.date.localeCompare(a.date));
  for(const s of done){
    const en=(s.entries||[]).find(e=>e.exId===exId&&e.sets.some(x=>!x.warmup));
    if(en)return{date:s.date,sets:en.sets.filter(x=>!x.warmup)};
  }
  return null;
}
function bestE1RM(sets){return sets.length?Math.max(...sets.map(s=>e1rm(s.w,s.r))):0}

/* ═══════════════════════════ SESSION LIFECYCLE ═══════════════════════════ */
function startSession(split,routineId){
  const r=routineId?DB.routines.find(x=>x.id===routineId&&x.split===split):null;
  DB.active={id:uid('sess'),date:today(),type:split,routineId:r?r.id:null,status:'completed',
    readiness:{sleep:0,soreness:0,stress:0},bodyweight:null,notes:'',
    startedAt:Date.now(),endedAt:null,synced:false,
    entries:(r?r.blocks:[]).map(b=>({exId:b.exId,
      plan:{sets:b.sets,repLow:b.repLow,repHigh:b.repHigh,targetWeight:null,increment:b.increment},
      sets:[],draft:null}))};
  DB.active.entries.forEach(en=>{
    const L=lastFor(en.exId); if(!L)return;
    const top=L.sets.reduce((a,b)=>e1rm(b.w,b.r)>e1rm(a.w,a.r)?b:a);
    en.plan.targetWeight=top.w;
    if(en.plan&&top.r>=en.plan.repHigh)en.plan.targetWeight=top.w+(en.plan.increment||5);
  });
  save();render(true);
}
function finishSession(){
  const a=DB.active; if(!a)return;
  a.entries=a.entries.filter(e=>e.sets.length);
  if(!a.entries.length){DB.active=null;save();render();return toast('Empty session discarded')}
  a.endedAt=Date.now(); a.entries.forEach(e=>delete e.draft);
  DB.sessions.push(a); DB.active=null; save(); tab='history'; render(true);
  toast('Session closed. Tap Sync when you have signal.');
}

/* ═══════════════════════════ VIEWS ═══════════════════════════ */
function render(toTop){
  const y=window.scrollY;
  const a=DB.active;
  $('hsub').textContent=a?`${a.type} in progress`:`${DB.sessions.length} sessions · ${unsyncedCount()} to sync`;
  $('hact').innerHTML=a?'<button class="btn btn-sm btn-sig" data-a="finish">Finish</button>':'';
  $('nav').innerHTML=['train','history','progress','data']
    .map(t=>`<button data-a="tab" data-t="${t}" class="${tab===t?'on':''}">${t}</button>`).join('');
  $('view').innerHTML={train:vTrain,history:vHistory,progress:vProgress,data:vData}[tab]();
  // Only jump to the top when the whole screen changed. Logging a set must not move the page.
  if(toTop===true){window.scrollTo(0,0);return}
  window.scrollTo(0,y);
  requestAnimationFrame(()=>window.scrollTo(0,y));
}

/* ---------- TRAIN ---------- */
function vTrain(){
  return DB.active?vSession():vStart();
}
function vStart(){
  const last=DB.sessions[DB.sessions.length-1];
  const rIds=[...new Set(DB.routines.map(r=>r.id))];
  return `
  <div class="card pad">
    <div class="lbl" style="margin-bottom:12px">Start a session</div>
    <div class="row wrap">${['Push','Pull','Legs','Other']
      .map(t=>`<button class="chip" data-a="start" data-t="${t}">${t}</button>`).join('')}</div>
    <div class="lbl" style="margin:16px 0 8px">Or run a plan</div>
    <div class="row wrap">${rIds.flatMap(id=>DB.routines.filter(r=>r.id===id)
      .map(r=>`<button class="chip sm" data-a="start" data-t="${r.split}" data-r="${r.id}">${esc(r.name)} · ${r.split}</button>`)).join('')}</div>
    ${last?`<div class="mute" style="font-size:12px;margin-top:16px">Last: ${last.type} on ${fmt(last.date)}</div>`:''}
  </div>
  <button class="btn" style="margin-bottom:12px" data-a="sheet" data-s="cardio">Log a run</button>
  <button class="btn" data-a="sheet" data-s="body">Log body stats</button>`;
}
function vSession(){
  const a=DB.active,X=exById();
  const sets=a.entries.reduce((n,e)=>n+e.sets.length,0);
  const vol=a.entries.reduce((v,e)=>v+e.sets.reduce((x,s)=>x+s.w*s.r,0),0);
  return `
  <div class="card pad row between">
    <div><div class="disp" style="font-size:26px;font-weight:700">${a.type}</div>
      <div class="lbl" style="margin-top:4px">${fmt(a.date)}${a.routineId?' · '+esc(a.routineId):''}</div></div>
    <div style="text-align:right"><div class="mono" style="font-size:20px">${sets}</div>
      <div class="lbl">sets · ${vol.toLocaleString()} lb</div></div>
  </div>
  ${a.entries.map((e,i)=>cardEx(e,i,X)).join('')}
  <button class="btn btn-sig" data-a="sheet" data-s="pick">+ Add exercise</button>
  <div class="card pad" style="margin-top:12px">
    <div class="lbl" style="margin-bottom:10px">Readiness — how you showed up</div>
    ${['sleep','soreness','stress'].map(k=>`
      <div class="row between" style="margin-bottom:9px">
        <span style="font-size:13px;text-transform:capitalize">${k}</span>
        <div class="row" style="gap:5px">${[1,2,3,4,5].map(n=>
          `<button class="chip sm ${a.readiness[k]===n?'on':''}" data-a="rdy" data-k="${k}" data-n="${n}"
            style="padding:6px 11px">${n}</button>`).join('')}</div>
      </div>`).join('')}
    <div class="lbl" style="margin:14px 0 6px">Notes</div>
    <textarea class="field" data-a="notes" placeholder="Pain, energy, anything worth remembering">${esc(a.notes)}</textarea>
  </div>`;
}
function cardEx(e,i,X){
  const ex=X[e.exId]||{name:e.exId,pattern:'Other'};
  const L=lastFor(e.exId,DB.active.id), lastBest=L?bestE1RM(L.sets):0;
  if(!e.draft){
    const top=L?L.sets.reduce((a,b)=>e1rm(b.w,b.r)>e1rm(a.w,a.r)?b:a):null;
    e.draft={w:(e.plan&&e.plan.targetWeight)??top?.w??0,
             r:top?.r??(e.plan?e.plan.repLow:8),rpe:8,warmup:false};
  }
  const d=e.draft, beat=!d.warmup&&lastBest>0&&e1rm(d.w,d.r)>lastBest;
  const work=e.sets.filter(s=>!s.warmup), bestNow=bestE1RM(work);
  return `
  <div class="card">
    <div class="pad row between" style="padding-bottom:10px">
      <div><div style="font-weight:600;font-size:16px">${esc(ex.name)}</div>
        <div class="lbl" style="margin-top:3px">${esc(ex.pattern)}${ex.anchor?' · anchor':''}</div></div>
      <button class="mute" style="font-size:22px;padding:0 6px" data-a="rmEx" data-i="${i}">×</button>
    </div>
    <div style="padding:0 14px 12px">
      <div class="ghost ${beat?'beat':''}">
        ${L?`<span class="lbl">${fmt(L.date)}</span>
             <span class="v">${L.sets.map(s=>s.w+'×'+s.r).join('  ')}</span>
             <span class="v" style="margin-left:auto">e1RM ${Math.round(lastBest)}</span>`
           :`<span class="lbl">First time logging this</span>`}
      </div>
      ${e.plan?`<div class="ghost plan"><span class="lbl">Plan</span>
        <span class="v">${e.plan.sets}×${e.plan.repLow}–${e.plan.repHigh}${
          e.plan.targetWeight?' @ '+e.plan.targetWeight:''}</span>
        <span class="v" style="margin-left:auto">${work.length}/${e.plan.sets} done</span></div>`:''}
    </div>
    ${e.sets.length?`<div style="border-top:1px solid var(--line);border-bottom:1px solid var(--line)">
      ${e.sets.map((s,j)=>`<div class="setrow">
        <span class="setno mono">${s.warmup?'w':e.sets.filter((x,k)=>k<j&&!x.warmup).length+1}</span>
        <span class="mono" style="font-size:15px">${s.w} × ${s.r}</span>
        <span class="mute mono" style="font-size:11px">RPE ${s.rpe}</span>
        ${s.warmup?'<span class="warm">WARMUP</span>'
          :(e1rm(s.w,s.r)>=bestNow&&e1rm(s.w,s.r)>lastBest&&lastBest>0?'<span class="pr">PR</span>':'')}
        <button class="mute" style="margin-left:auto;font-size:17px" data-a="rmSet" data-i="${i}" data-j="${j}">×</button>
      </div>`).join('')}</div>`:''}
    <div class="pad">
      <div class="row" style="gap:10px;margin-bottom:10px">
        <div style="flex:1"><div class="lbl" style="margin-bottom:5px">Weight</div>
          <div class="step">
            <button data-a="stp" data-i="${i}" data-f="w" data-d="-5">−</button>
            <input type="number" inputmode="decimal" value="${d.w}" data-a="in" data-i="${i}" data-f="w">
            <button data-a="stp" data-i="${i}" data-f="w" data-d="5">+</button></div></div>
        <div style="flex:1"><div class="lbl" style="margin-bottom:5px">Reps</div>
          <div class="step">
            <button data-a="stp" data-i="${i}" data-f="r" data-d="-1">−</button>
            <input type="number" inputmode="numeric" value="${d.r}" data-a="in" data-i="${i}" data-f="r">
            <button data-a="stp" data-i="${i}" data-f="r" data-d="1">+</button></div></div>
      </div>
      <div class="row between" style="margin-bottom:10px">
        <div class="lbl">RPE</div>
        <button class="chip sm ${d.warmup?'on':''}" data-a="warm" data-i="${i}">Warm-up</button>
      </div>
      <div class="row" style="gap:6px;margin-bottom:12px">
        ${[6,7,8,9,10].map(n=>`<button class="chip ${d.rpe===n?'on':''}" data-a="rpe" data-i="${i}"

/* ---------- PROGRESS ---------- */
function vProgress(){
  if(!DB.sessions.length)return `<p class="empty">Charts appear once you've logged a few sessions.<br>
    Deeper analysis lives in the Sheet.</p>`;
  const X=exById();
  const seen=new Set(); DB.sessions.forEach(s=>s.entries.forEach(e=>seen.add(e.exId)));
  const anchors=DB.exercises.filter(e=>seen.has(e.id)&&e.anchor);
  const series=anchors.map(a=>{
    const pts=DB.sessions.filter(s=>s.entries.some(e=>e.exId===a.id&&e.sets.some(x=>!x.warmup)))
      .sort((x,y)=>x.date.localeCompare(y.date))
      .map(s=>bestE1RM(s.entries.find(e=>e.exId===a.id).sets.filter(x=>!x.warmup)));
    return{name:a.name,pts};
  }).filter(s=>s.pts.length);
  const wk={};
  DB.sessions.forEach(s=>s.entries.forEach(e=>{
    const g=(X[e.exId]||{}).group||'Other';
    wk[g]=(wk[g]||0)+e.sets.filter(x=>!x.warmup).reduce((v,x)=>v+x.w*x.r,0)}));
  const maxV=Math.max(1,...Object.values(wk));
  return `
  <div class="card pad">
    <div class="lbl" style="margin-bottom:12px">Estimated 1RM — anchor lifts</div>
    ${series.length?series.map(s=>`
      <div style="margin-bottom:16px">
        <div class="row between" style="margin-bottom:4px">
          <span style="font-size:13px;font-weight:500">${esc(s.name)}</span>
          <span class="mono" style="font-size:13px;color:var(--sig)">${Math.round(s.pts[s.pts.length-1])}</span>
        </div>${spark(s.pts)}</div>`).join('')
      :'<p class="mute" style="font-size:13px">Log an anchor lift twice to see a trend.</p>'}
  </div>
  <div class="card pad">
    <div class="lbl" style="margin-bottom:12px">Volume by group — all time (lb)</div>
    ${Object.entries(wk).sort((a,b)=>b[1]-a[1]).map(([g,v])=>`
      <div style="margin-bottom:10px">
        <div class="row between" style="font-size:12px;margin-bottom:4px">
          <span>${g}</span><span class="mono mute">${v.toLocaleString()}</span></div>
        <div style="height:6px;background:#0C0E12;border-radius:3px;overflow:hidden">
          <div style="height:100%;width:${(v/maxV*100).toFixed(1)}%;background:var(--sig)"></div></div>
      </div>`).join('')}
  </div>
  <p class="mute" style="font-size:12px;line-height:1.6">Real analysis belongs in the Sheet — this is
  just enough to know whether the last session moved you forward.</p>`;
}
function spark(pts){
  if(pts.length<2)return '<div class="mute" style="font-size:12px">One data point so far.</div>';
  const W=300,H=44,mn=Math.min(...pts),mx=Math.max(...pts),rg=(mx-mn)||1;
  const d=pts.map((p,i)=>`${(i/(pts.length-1)*W).toFixed(1)},${(H-4-((p-mn)/rg)*(H-10)).toFixed(1)}`).join(' L');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="M${d}" fill="none" stroke="var(--sig)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

/* ═══════════════════════════ ROW BUILDERS (match Sheet columns) ═══════════════════════════ */
function setRows(s,X){
  const out=[];
  s.entries.forEach(e=>{
    const ex=X[e.exId]||{name:e.exId,pattern:'Other',group:'Other',anchor:false};
    let n=0;
    e.sets.forEach(st=>{
      if(!st.warmup)n++;
      out.push([st.id,s.id,s.date,s.type,s.status,s.routineId||'',ex.name,ex.pattern,ex.group,
        ex.anchor?'Y':'N',st.warmup?0:n,st.warmup?'Y':'N',st.w,st.r,st.rpe,e1rm(st.w,st.r),
        +(st.w*st.r).toFixed(1),e.plan?.targetWeight??'',e.plan?.repLow??'',e.plan?.repHigh??'',
        st.t?new Date(st.t).toISOString():'']);
    });
  });
  return out;
}
function sessionRow(s){
  const sets=s.entries.reduce((n,e)=>n+e.sets.filter(x=>!x.warmup).length,0);
  const vol=s.entries.reduce((v,e)=>v+e.sets.filter(x=>!x.warmup).reduce((x,t)=>x+t.w*t.r,0),0);
  return [s.id,s.date,s.type,s.routineId||'',s.status,s.readiness.sleep||'',s.readiness.soreness||'',
    s.readiness.stress||'',s.bodyweight||'',s.endedAt&&s.startedAt?Math.round((s.endedAt-s.startedAt)/6e4):'',
    sets,+vol.toFixed(1),s.notes||''];
}
const cardioRow=c=>[c.id,c.date,c.miles,c.minutes,+(c.minutes/c.miles).toFixed(2),c.effort,c.avgHr||'',c.notes||''];
const bodyRow=b=>[b.id,b.date,b.weight,b.bf||'',b.waist||''];

function unsyncedCount(){
  return DB.sessions.filter(s=>!s.synced).length+DB.cardio.filter(c=>!c.synced).length
        +DB.body.filter(b=>!b.synced).length;
}
function payload(all){
  const X=exById(),pick=x=>all||!x.synced;
  return{sets:DB.sessions.filter(pick).flatMap(s=>setRows(s,X)),
         sessions:DB.sessions.filter(pick).map(sessionRow),
         cardio:DB.cardio.filter(pick).map(cardioRow),
         body:DB.body.filter(pick).map(bodyRow)};
}
async function sync(all){
  const{endpoint,token}=DB.settings;
  if(!endpoint)return toast('Add your Apps Script URL first');
  const p=payload(all);
  const n=p.sessions.length+p.cardio.length+p.body.length;
  if(!n)return toast('Nothing to send');
  toast('Sending…');
  const body=JSON.stringify({token,...p});
  const opts={method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body};
  try{
    const res=await fetch(endpoint,opts); const j=await res.json();
    if(!j.ok)throw new Error(j.error||'rejected');
    markSynced(all); toast(`Synced — ${j.written} row${j.written===1?'':'s'} written`);
  }catch(err){
    try{ await fetch(endpoint,{...opts,mode:'no-cors'});
      markSynced(all); toast('Sent. Check the Sheet — re-sending is safe.');
    }catch(e2){ toast('No connection. Data is safe here — try again later.') }
  }
  render();
}
function markSynced(all){
  const f=x=>{if(all||!x.synced)x.synced=true};
  DB.sessions.forEach(f);DB.cardio.forEach(f);DB.body.forEach(f);save();
}
function download(name,text,type){
  const b=new Blob([text],{type});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportCsv(){
  const X=exById();
  const head=['set_uid','session_id','date','split','status','routine','exercise','pattern','group',
    'anchor','set_no','warmup','weight_lb','reps','rpe','e1rm','volume_lb','plan_weight',
    'plan_rep_low','plan_rep_high','logged_at'];
  const rows=DB.sessions.flatMap(s=>setRows(s,X));
  const q=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  download(`iron-ledger-${today()}.csv`,[head,...rows].map(r=>r.map(q).join(',')).join('\n'),'text/csv');
}

function shPick(raw){
  const used=DB.active?DB.active.entries.map(e=>e.exId):[];

  const q=raw.trim().toLowerCase(); // lowercase copy, used only for matching
  let list=DB.exercises.filter(e=>!used.includes(e.id));

  else if(pats)list=list.filter(e=>pats.includes(e.pattern));
  list.sort((a,b)=>(b.anchor?1:0)-(a.anchor?1:0)||a.name.localeCompare(b.name));
  const exact=DB.exercises.some(e=>e.name.toLowerCase()===q);

/* ═══════════════════════════ EVENTS ═══════════════════════════ */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-a]'); if(!t)return;
  const a=t.dataset.a, i=+t.dataset.i, A=DB.active;
  const acts={
    tab:()=>{tab=t.dataset.t;render(true)},
    start:()=>startSession(t.dataset.t,t.dataset.r||null),
    finish:()=>finishSession(),
    sheet:()=>openSheet(t.dataset.s),
    close:()=>closeSheet(),
    rdy:()=>{A.readiness[t.dataset.k]=+t.dataset.n;save();render()},
    stp:()=>{const e=A.entries[i],f=t.dataset.f;
      e.draft[f]=Math.max(0,+(e.draft[f]+ +t.dataset.d).toFixed(2));save();render()},
    rpe:()=>{A.entries[i].draft.rpe=+t.dataset.n;save();render()},
    warm:()=>{A.entries[i].draft.warmup=!A.entries[i].draft.warmup;save();render()},
    logSet:()=>{const e=A.entries[i],d=e.draft;
      if(!d.r)return toast('Reps must be above zero');
      e.sets.push({id:uid('s'),w:d.w,r:d.r,rpe:d.rpe,warmup:d.warmup,t:Date.now()});
      d.warmup=false;save();render()},
    rmSet:()=>{A.entries[i].sets.splice(+t.dataset.j,1);save();render()},
    rmEx:()=>{A.entries.splice(i,1);save();render()},
    addEx:()=>{A.entries.push({exId:t.dataset.id,plan:null,sets:[],draft:null});
      save();closeSheet();render()},
    newEx:()=>{const q=$('q').value.trim();if(!q)return;
      NEWEX={name:q,pattern:null,anchor:false};$('sheet').innerHTML=shNewEx()},
    nePat:()=>{NEWEX.name=$('nename').value;NEWEX.pattern=t.dataset.p;$('sheet').innerHTML=shNewEx()},
    neAnchor:()=>{NEWEX.name=$('nename').value;NEWEX.anchor=!NEWEX.anchor;$('sheet').innerHTML=shNewEx()},
    neAdd:()=>{const name=$('nename').value.trim();
      if(!name||!NEWEX.pattern)return toast('Name and pattern are both needed');
      const ex={id:uid('ex'),name:name,pattern:NEWEX.pattern,
        group:PATTERN_GROUP[NEWEX.pattern]||'Other',anchor:NEWEX.anchor,custom:true};
      DB.exercises.push(ex);A.entries.push({exId:ex.id,plan:null,sets:[],draft:null});
      NEWEX=null;save();closeSheet();render()},
    f:()=>{const el=$(t.dataset.t);el.value=Math.max(0,+(+el.value+ +t.dataset.d).toFixed(2))},
    pickN:()=>{[...$(t.dataset.g).children].forEach(c=>c.classList.remove('on'));t.classList.add('on')},
    saveCardio:()=>{const mi=+$('miles').value,mn=+$('minutes').value;
      if(!mi||!mn)return toast('Distance and time are both needed');
      DB.cardio.push({id:uid('run'),date:today(),miles:mi,minutes:mn,
        effort:+($('effort').querySelector('.on')?.dataset.n||6),
        avgHr:+$('avgHr').value||null,notes:$('cnotes').value,synced:false});
      save();closeSheet();tab='history';render(true);toast('Run logged')},
    saveBody:()=>{DB.body.push({id:uid('bod'),date:today(),weight:+$('weight').value,
        bf:+$('bf').value||null,waist:+$('waist').value||null,synced:false});
      save();closeSheet();tab='history';render(true);toast('Stats logged')},
    sync:()=>sync(false),
    resync:()=>sync(true),
    csv:()=>exportCsv(),
    backup:()=>download(`iron-ledger-backup-${today()}.json`,JSON.stringify(DB,null,1),'application/json')
  };
  if(acts[a]){ev.preventDefault();acts[a]()}
});
document.addEventListener('input',ev=>{
  const t=ev.target.closest('[data-a]'); if(!t)return;
  if(t.dataset.a==='in'){DB.active.entries[+t.dataset.i].draft[t.dataset.f]=+t.value||0;save()}
  if(t.dataset.a==='notes'){DB.active.notes=t.value;save()}
  if(t.dataset.a==='set'){DB.settings[t.dataset.k]=t.value.trim();save()}
  if(t.dataset.a==='q'){const v=t.value;const s=$('sheet');
    s.innerHTML=shPick(v);const q=s.querySelector('#q');q.focus();q.setSelectionRange(v.length,v.length)}
});

/* ═══════════════════════════ BOOT ═══════════════════════════ */
load();render();
if('serviceWorker' in navigator)
  navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('online',()=>{if(DB.settings.endpoint&&unsyncedCount())sync(false)});
</script>
